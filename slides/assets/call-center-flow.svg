  </defs>
  <rect width="900" height="240" rx="20" fill="#fafafa"/>
  <path d="M150 120 H250 M350 120 H450 M550 120 H650 M750 120 H780" stroke="#ae1615" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.35"/>
  <path d="M246 114 L258 120 L246 126" fill="none" stroke="#ae1615" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M446 114 L458 120 L446 126" fill="none" stroke="#ae1615" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M646 114 L658 120 L646 126" fill="none" stroke="#ae1615" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
