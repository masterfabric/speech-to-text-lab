    <rect x="790" y="70" width="80" height="100" rx="14" fill="#fff" stroke="#e5e5e5"/>
    <g transform="translate(830,108) scale(0.9) translate(-12,-12)" fill="none" stroke="#ae1615" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
